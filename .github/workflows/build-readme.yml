name: Build README

on:
  push:
    branches: [main]
    paths:
      - _data/resume.yml
      - _includes/resume.md
      - bin/build-readme
      - Gemfile
      - Gemfile.lock
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bin/build-readme
      # Pushes made with GITHUB_TOKEN don't trigger workflows, so this commit can't loop.
      - name: Commit README if it changed
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Regenerate README from resume data"
          git push
